<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <button class="openBtn">Open modal</button>

    <div class="overlay">
        <div class="modal">
            <h2>Modal window</h2>
            <button class="closeBtn">Close</button>
        </div>
    </div>

    <form class="colorForm">
        <input type="text" placeholder="Enter color" name="color">
        <button type="submit">Change color</button>
    </form>

    <form class="numberForm">
        <input type="text" placeholder="Enter numbers" name="numbers">
        <button class="average">Average</button>
    </form>

    <script src="script.js"></script>
</body>

</html>
